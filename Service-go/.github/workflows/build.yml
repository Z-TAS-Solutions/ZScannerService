name: Build and Store Binary

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build Binary
        run: |
          env GOOS=linux GOARCH=arm64 go build -o ZScannerService cmd/grpc/main.go

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZScannerService-artifact
          path: ZScannerService
          retention-days: 7 
